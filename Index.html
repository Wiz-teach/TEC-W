        </div>
    </header>

    <!-- Main Quiz Area -->
    <main class="flex-grow max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
        
        <div class="bg-white rounded-3xl shadow-lg border border-blue-100 overflow-hidden">
            
            <!-- Question Display Area -->
            <div class="p-8 sm:p-12 text-center bg-white">
                <h2 id="question-text" class="question-font text-3xl sm:text-4xl font-bold text-slate-800 leading-tight mb-8">
                    <!-- Question injected here -->
                </h2>

                <!-- Options -->
                <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto text-left">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- Feedback Area (Hidden by default) -->
            <div id="feedback-area" class="hidden border-t border-slate-100 p-6 sm:p-8 bg-slate-50 transition-all duration-300">
                <div class="flex items-start gap-4">
                    <div id="feedback-icon" class="text-3xl mt-1"></div>
                    <div class="flex-1">

                    </div>

                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-3xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-slate-500">

    </footer>

        function loadRandomQuestion() {
            isAnswered = false;
            feedbackArea.classList.add('hidden');
            optionsContainer.innerHTML = '';

            // Pick a random question
            const randomIndex = Math.floor(Math.random() * questionsRepo.length);
            currentQuestionObj = questionsRepo[randomIndex];

            // Set question text
            questionTextEl.innerText = currentQuestionObj.q;

            // Generate options
            currentQuestionObj.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = "text-left text-lg font-bold text-slate-700 bg-white border-2 border-slate-200 rounded-xl p-4 hover:border-blue-500 hover:bg-blue-50 transition-all duration-200";
                btn.innerText = optText;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, buttonElement) {
            if (isAnswered) return;
            isAnswered = true;

            const isCorrect = selectedIndex === currentQuestionObj.correct;
            const allButtons = optionsContainer.children;

            // Disable all buttons and style them
            for (let i = 0; i < allButtons.length; i++) {
                allButtons[i].disabled = true;
                allButtons[i].classList.remove('hover:border-blue-500', 'hover:bg-blue-50');
                
                if (i === currentQuestionObj.correct) {
                    // Correct answer style
                    allButtons[i].classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                } else if (i === selectedIndex && !isCorrect) {
                    // Wrong selected answer style
                    allButtons[i].classList.add('border-rose-400', 'bg-rose-50', 'text-rose-700');
                } else {
                    // Other unselected options fade out
                    allButtons[i].classList.add('opacity-50');
                }
            }

            // Update Feedback Area
            feedbackArea.classList.remove('hidden');
            
            if (isCorrect) {

                feedbackIcon.innerText = "✅";
                feedbackTitle.innerText = "Correct!";

                feedbackIcon.innerText = "❌";
                feedbackTitle.innerText = "Wrong!";
                feedbackTitle.className = "text-lg font-bold text-rose-600 mb-1";
            }
            
            feedbackTip.innerText = currentQuestionObj.tip;
        }

        function toggleRepository() {
            if (repoModal.classList.contains('hidden')) {
                // Populate if empty
                if (repoList.innerHTML === '') {
                    questionsRepo.forEach((item, index) => {
                        const correctLetter = item.options[item.correct].substring(0, 2); // gets "A)"
                        const correctWord = item.options[item.correct].substring(3); // gets "is/am/are"
                        
                        const div = document.createElement('div');
                        div.className = "p-3 bg-blue-50 rounded-lg border border-blue-100 text-sm";
                        div.innerHTML = `
                            <p class="font-bold text-slate-800 mb-1">${index + 1}. ${item.q}</p>
                            <p class="text-emerald-600 font-semibold mb-1">Answer: ${correctLetter} ${correctWord}</p>
                            <p class="text-slate-500 text-xs italic">${item.tip}</p>
                        `;
                        repoList.appendChild(div);
                    });
                }
                repoModal.classList.remove('hidden');
            } else {
                repoModal.classList.add('hidden');
            }
        }

        // Start first question on load
        window.onload = loadRandomQuestion;

    </script>
</body>
</html>
